# Line 1 — pre-commit. Copy (or symlink) into the target repo root as .pre-commit-config.yaml
# and run:  pre-commit install
# The checks read the diff vs origin/main; under pre-commit, staged files are passed as arguments.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks  # NN#3 (deep secrets scan)

  - repo: local
    hooks:
      - id: rls-check
        name: "NN#1 — RLS on every table"
        entry: enforcement/scripts/check-rls.sh
        language: script
        files: \.sql$
      - id: rate-limit-check
        name: "NN#2 — rate limit on public endpoints"
        entry: enforcement/scripts/check-rate-limit.sh
        language: script
        files: \.py$
      - id: env-tracked-check
        name: "NN#3 — no tracked .env/secrets"
        entry: enforcement/scripts/check-env-tracked.sh
        language: script
        pass_filenames: true
      - id: forbid-any
        name: "Type safety — any is forbidden (TS)"
        entry: enforcement/scripts/forbid-any.sh
        language: script
        files: \.tsx?$
      - id: test-present
        name: "Companion tests for new source files"
        entry: enforcement/scripts/check-test-present.sh
        language: script
        pass_filenames: false
      - id: verify-deps
        name: "Package hallucination — dependencies exist"
        entry: enforcement/scripts/verify-dependencies.sh
        language: script
        files: (requirements\.txt|package\.json|pyproject\.toml)$
        pass_filenames: false
