# Line 3a — always-on CI: the 3 Non-Negotiables block the merge.
name: Non-Negotiables
on:
  pull_request:
    branches: [main, master]

jobs:
  nn1-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: NN#1 — RLS on every table
        run: bash enforcement/scripts/check-rls.sh

  nn2-rate-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: NN#2 — rate limit on public endpoints
        run: bash enforcement/scripts/check-rate-limit.sh

  nn3-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: NN#3 — no versioned secrets
        run: bash enforcement/scripts/check-env-tracked.sh
      - name: gitleaks (deep scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
